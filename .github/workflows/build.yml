name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project has no Gradle wrapper, so the runner installs the same Gradle version the
      # author builds with.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # COUI 2.0.0 requires compileSdk 37, so the SDK image needs that platform and a build-tools
      # recent enough to have an AAPT2 that copes with the merged resource table.
      - name: Install SDK components
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SideBackStyle-apk
          path: app/build/outputs/apk/debug/*.apk
